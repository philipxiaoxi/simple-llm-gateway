<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="中转台" />
    <meta name="theme-color" content="#0b0d11" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>中转台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* 启动画面：在 JS/CSS 加载完成前显示，避免 iOS 黑屏 */
      html,
      body {
        margin: 0;
        background: #0b0d11;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0d11;
        transition: opacity 0.3s ease;
      }
      #boot-splash.boot-splash-hide {
        opacity: 0;
        pointer-events: none;
      }
      .boot-splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }
      .boot-logo {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 14px;
        letter-spacing: 0.28em;
        color: #c8f542;
      }
      .boot-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(200, 245, 66, 0.2);
        border-top-color: #c8f542;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash" aria-hidden="true">
      <div class="boot-splash-inner">
        <div class="boot-logo">中转台</div>
        <div class="boot-spinner" role="status" aria-label="加载中"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
