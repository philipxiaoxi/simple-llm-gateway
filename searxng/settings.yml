# SearXNG 配置模板。挂载到容器的 /etc/searxng/settings.yml。
# 用 use_default_settings 继承官方默认配置，只覆盖需要改的字段。
use_default_settings: true

server:
  # 私有实例关闭内置限流，否则网关高频调用会遇到 429。
  # 实例一旦暴露到公网，请改回 true 并配置 Redis。
  limiter: false
  image_proxy: true

search:
  # 默认只输出 HTML。网关走 ?format=json，必须显式打开 json，否则返回 403。
  formats:
    - html
    - json
  safe_search: 0
  default_lang: zh-CN
  # Agent 用不到自动补全，关掉可少一次外部请求
  autocomplete: ""

engines:
  # 国内网络下默认启用的国外引擎常超时，改用可达的引擎
  - name: baidu
    disabled: false
  - name: 360search
    disabled: false
  - name: sogou
    disabled: false
  - name: bing
    disabled: false
  - name: google
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: startpage
    disabled: true
  - name: qwant
    disabled: true
